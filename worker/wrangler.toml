name = "task-management-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# This Worker reads/writes Cloudflare D1 STAGING directly (no Supabase at runtime, no
# DATA_BACKEND flag). Supabase remains the source/rollback reference but is NOT used by
# the deployed Worker on this branch.
[[d1_databases]]
binding = "DB"
database_name = "task-management-staging"
database_id = "e262c9ce-8d5f-46d0-86c7-24030b9e760d"

# No production D1 binding, no routes, no custom domain. task-management-production is
# intentionally NOT created/bound yet.
#
# SECURITY: write endpoints have NO app auth yet — staging/internal only. Add access
# control before any production exposure.
