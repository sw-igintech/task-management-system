name: Deploy Cloudflare Worker Production

# Deploys the PRODUCTION-CANDIDATE Worker `task-management-api-production`, bound to the D1
# PRODUCTION database (see worker/wrangler.toml [env.production]). This is a separate Worker
# from the staging `task-management-api` and does NOT touch it. No DNS/routes, no custom
# domain, no Supabase at runtime. MANUAL trigger only — never auto/never on main.
#
# Prereq: run "D1 Production Import" first, then set the real database_id in
# worker/wrangler.toml [[env.production.d1_databases]].

on:
  workflow_dispatch:
  # TEMPORARY (this session only): self-scoped push trigger to register + run once.
  # Restored to workflow_dispatch-only afterward.
  push:
    branches: [cloudflare/full-migration]
    paths: ['.github/workflows/deploy-cloudflare-worker-production.yml']

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production Worker (task-management-api-production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Typecheck Worker
        run: npm run typecheck

      # --env production → name task-management-api-production + D1 production binding.
      # Uses the same D1-only Worker code; no Supabase runtime secrets.
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production
