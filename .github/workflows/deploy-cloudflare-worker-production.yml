name: Deploy Cloudflare Worker Production

# Deploys the production Worker `task-management-api-production`, bound to the D1 PRODUCTION
# database (see worker/wrangler.toml [env.production]). It is a SEPARATE Worker from the
# staging `task-management-api` and never touches it (`--env production` targets the prod
# name + prod D1 binding only). No DNS/routes, no custom domain, no Supabase at runtime.
#
# Runs automatically on push to main when Worker code/config changes, plus manual dispatch.
# It deploys code only — it never imports/overwrites D1 data.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-cloudflare-worker-production.yml'
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping production Worker deploys; let the newest push win.
concurrency:
  group: worker-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production Worker (task-management-api-production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Typecheck Worker
        run: npm run typecheck

      # --env production → name task-management-api-production + D1 production binding.
      # Uses the same D1-only Worker code; no Supabase runtime secrets.
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production
