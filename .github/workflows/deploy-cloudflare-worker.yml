name: Deploy Cloudflare Worker

# Deploys the read-only Cloudflare Worker API (task-management-api) that sits in
# front of Supabase. STAGING/intermediate step only — the frontend is NOT switched
# to it yet, and production (Vercel + Supabase) is untouched. No D1, no email.
# GitHub Actions owns the deploy (not Cloudflare Git integration).

on:
  push:
    branches: [cloudflare/full-migration] # never main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy Worker (task-management-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Typecheck Worker
        run: npm run typecheck

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Secrets are piped via stdin to wrangler (never echoed). GitHub also masks
      # registered secret values in logs. SUPABASE_URL reuses the existing
      # VITE_SUPABASE_URL value (same URL, server-side name).
      - name: Set Worker secret SUPABASE_URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            printf '%s' "$SUPABASE_URL" | npx wrangler secret put SUPABASE_URL
          else
            echo "VITE_SUPABASE_URL GitHub secret not set — skipping SUPABASE_URL."
          fi

      # SERVICE ROLE key is server-side only. The step is skipped (not failed) if the
      # GitHub secret is absent; /api/* then returns 503 until it is added.
      - name: Set Worker secret SUPABASE_SERVICE_ROLE_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          else
            echo "SUPABASE_SERVICE_ROLE_KEY GitHub secret is NOT set — skipping."
            echo "Add it (repo Settings > Secrets > Actions) so /api/people and /api/tasks can read Supabase."
          fi
