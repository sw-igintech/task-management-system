name: Deploy Cloudflare Worker

# Deploys the read-only Cloudflare Worker API (task-management-api) that sits in
# front of Supabase. STAGING/intermediate step only — the frontend is NOT switched
# to it yet, and production (Vercel + Supabase) is untouched. No D1, no email.
# GitHub Actions owns the deploy (not Cloudflare Git integration).

on:
  push:
    branches: [cloudflare/full-migration] # never main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy Worker (task-management-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Typecheck Worker
        run: npm run typecheck

      # The Worker uses the D1 binding (see worker/wrangler.toml) — no Supabase runtime
      # secrets are needed. (The VITE_SUPABASE_* / SUPABASE_SERVICE_ROLE_KEY GitHub secrets
      # still exist but are no longer used by this Worker; any previously-set Worker secrets
      # are simply ignored by the new code.)
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
