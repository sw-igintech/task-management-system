name: Deploy Cloudflare Pages

# Parallel / STAGING deployment of the existing Vite frontend to Cloudflare Pages.
# This does NOT touch production: Vercel remains the live frontend and Supabase
# remains the live database. No Workers, no D1, no email, no DNS/custom domain.
# GitHub Actions (not Cloudflare Git integration) owns this deploy.

on:
  push:
    branches: [cloudflare/full-migration] # staging branch only — NOT main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy to Cloudflare Pages (staging)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite inlines VITE_* at build time. Supabase values come from GitHub Secrets so
      # the staging site connects to the SAME Supabase as production (the anon key is a
      # public client key by design). The Worker-mode flags come from GitHub Variables
      # (non-secret): when VITE_USE_WORKER_API=true and VITE_WORKER_API_URL is set, the
      # frontend uses the Worker API; otherwise it falls back to direct Supabase. If any
      # are absent the build still succeeds (direct Supabase, or mock if Supabase absent).
      # Never hardcode these values.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_USE_WORKER_API: ${{ vars.VITE_USE_WORKER_API }}
          VITE_WORKER_API_URL: ${{ vars.VITE_WORKER_API_URL }}
        run: npm run build

      # Create the Pages project on first run (no-op if it already exists). Keeps
      # GitHub Actions the deploy owner — do NOT enable Cloudflare Git integration.
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create task-management-system \
            --production-branch main \
          || echo "Pages project already exists (or was created previously) — continuing."

      # Deploy the static build. --branch=staging makes this a PREVIEW deployment
      # (production branch is 'main'), so it never overwrites a production deploy.
      - name: Deploy dist to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy dist \
            --project-name task-management-system \
            --branch staging \
            --commit-dirty=true
