name: Deploy Cloudflare Pages Production

# Builds the frontend pointed at the PRODUCTION Worker and deploys it as the OFFICIAL
# production deployment of the `task-management-system` Pages project (the project's
# production branch → https://task-management-system-3nm.pages.dev).
#
# This is the official Cloudflare production frontend. It does NOT change DNS/custom domain,
# does NOT disable Vercel/Supabase (kept as rollback), and uses NO Cloudflare Git
# integration (GitHub Actions owns deploy).
#
# Runs automatically on every push to main (build failure blocks deploy), plus manual
# dispatch. It only deploys the static frontend — it never touches D1 data.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping production deploys; let the newest push win.
concurrency:
  group: pages-production
  cancel-in-progress: true

env:
  VITE_USE_WORKER_API: 'true'
  VITE_WORKER_API_URL: 'https://task-management-api-production.sw-590.workers.dev'

jobs:
  deploy:
    name: Build & deploy official production frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Worker API mode → production Worker)
        env:
          VITE_USE_WORKER_API: ${{ env.VITE_USE_WORKER_API }}
          VITE_WORKER_API_URL: ${{ env.VITE_WORKER_API_URL }}
        run: npm run build

      # --branch main → the project's PRODUCTION branch, so this is the official production
      # deployment served at https://task-management-system-3nm.pages.dev (not a preview alias).
      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy dist \
            --project-name task-management-system \
            --branch main \
            --commit-dirty=true
